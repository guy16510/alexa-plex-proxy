AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Private Alexa skill for playing music from Plex through an Unraid gateway.

Parameters:
  AlexaSkillId:
    Type: String
  GatewayBaseUrl:
    Type: String
  GatewayApiKey:
    Type: String
    NoEcho: true
  StreamSigningSecret:
    Type: String
    NoEcho: true
  MaxQueueTracks:
    Type: Number
    Default: 150
  StreamUrlTtlSeconds:
    Type: Number
    Default: 900

Resources:
  QueueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  SkillFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/index.handler
      Runtime: nodejs20.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          ALEXA_SKILL_ID: !Ref AlexaSkillId
          GATEWAY_BASE_URL: !Ref GatewayBaseUrl
          GATEWAY_API_KEY: !Ref GatewayApiKey
          STREAM_SIGNING_SECRET: !Ref StreamSigningSecret
          STREAM_URL_TTL_SECONDS: !Ref StreamUrlTtlSeconds
          MAX_QUEUE_TRACKS: !Ref MaxQueueTracks
          QUEUE_TABLE: !Ref QueueTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QueueTable
      Events:
        AlexaSkillEvent:
          Type: AlexaSkill
          Properties:
            SkillId: !Ref AlexaSkillId

Outputs:
  SkillFunctionArn:
    Value: !GetAtt SkillFunction.Arn
  QueueTableName:
    Value: !Ref QueueTable
