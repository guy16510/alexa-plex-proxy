services:
  alexa-plex-proxy:
    image: ghcr.io/guy16510/alexa-plex-proxy:latest
    container_name: alexa-plex-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      PLEX_URL: ${PLEX_URL:?Set PLEX_URL before starting}
      PLEX_TOKEN: ${PLEX_TOKEN:?Set PLEX_TOKEN before starting}
      PLEX_MUSIC_LIBRARY: ${PLEX_MUSIC_LIBRARY:-Music}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY before starting}
      STREAM_SIGNING_SECRET: ${STREAM_SIGNING_SECRET:?Set STREAM_SIGNING_SECRET before starting}
      STREAM_URL_MAX_TTL_SECONDS: ${STREAM_URL_MAX_TTL_SECONDS:-21600}
      MAX_QUEUE_TRACKS: ${MAX_QUEUE_TRACKS:-150}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
