AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Private serverless Alexa skill for Plex music playback

Parameters:
  AlexaSkillId:
    Type: String
    Description: Alexa Skill ID, for example amzn1.ask.skill.xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  PlexOriginDomain:
    Type: String
    Description: Public Plex hostname without scheme or port, usually the plex.direct hostname
    AllowedPattern: '^[A-Za-z0-9.-]+$'
  PlexOriginPort:
    Type: Number
    Default: 32400
    MinValue: 1024
    MaxValue: 65535
    Description: Public HTTPS port exposed by Plex Remote Access
  PlexToken:
    Type: String
    NoEcho: true
    Description: Plex authentication token used by Lambda and included in private stream URLs
  PlexMusicLibrary:
    Type: String
    Default: Music
  MaxQueueTracks:
    Type: Number
    Default: 150
    MinValue: 1
    MaxValue: 500
  MaxAudioBitrate:
    Type: Number
    Default: 192
    AllowedValues: [64, 96, 128, 160, 192, 256, 320]
  TranscodePolicy:
    Type: String
    Default: auto
    AllowedValues: [auto, always, never]
  QueueTtlHours:
    Type: Number
    Default: 24
    MinValue: 1
    MaxValue: 168

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Tracing: Active

Resources:
  PlexNoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-plex-no-cache'
        Comment: Disable caching so Plex authenticates every audio and artwork request
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  PlexOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-plex-query-strings'
        Comment: Forward Plex authentication and transcode query parameters to the origin
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all

  PlexDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${AWS::StackName} Plex audio endpoint for Alexa'
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: plex-origin
            DomainName: !Ref PlexOriginDomain
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: !Ref PlexOriginPort
              OriginKeepaliveTimeout: 5
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 60
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: plex-origin
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: false
          CachePolicyId: !Ref PlexNoCachePolicy
          OriginRequestPolicyId: !Ref PlexOriginRequestPolicy
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  QueueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  SkillFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-skill'
      CodeUri: .
      Handler: src/index.handler
      Description: Private Alexa Plex music skill
      Environment:
        Variables:
          ALEXA_SKILL_ID: !Ref AlexaSkillId
          PLEX_URL: !Sub 'https://${PlexOriginDomain}:${PlexOriginPort}'
          PLEX_TOKEN: !Ref PlexToken
          PLEX_MUSIC_LIBRARY: !Ref PlexMusicLibrary
          STREAM_BASE_URL: !Sub 'https://${PlexDistribution.DomainName}'
          QUEUE_TABLE: !Ref QueueTable
          MAX_QUEUE_TRACKS: !Ref MaxQueueTracks
          MAX_AUDIO_BITRATE: !Ref MaxAudioBitrate
          TRANSCODE_POLICY: !Ref TranscodePolicy
          QUEUE_TTL_HOURS: !Ref QueueTtlHours
          PLEX_REQUEST_TIMEOUT_MS: '10000'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QueueTable
      Events:
        AlexaSkillEvent:
          Type: AlexaSkill
          Properties:
            SkillId: !Ref AlexaSkillId

  SkillFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: SkillFunction
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-skill'
      RetentionInDays: 14

Outputs:
  SkillFunctionArn:
    Description: Paste this ARN into the Alexa Developer Console endpoint
    Value: !GetAtt SkillFunction.Arn
  StreamBaseUrl:
    Description: Alexa-compatible HTTPS endpoint managed by CloudFront
    Value: !Sub 'https://${PlexDistribution.DomainName}'
  QueueTableName:
    Value: !Ref QueueTable
  PlexApiUrl:
    Value: !Sub 'https://${PlexOriginDomain}:${PlexOriginPort}'
