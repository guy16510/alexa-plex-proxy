name: Build Alexa Plex Proxy Image

on:
  push:
    branches:
      - main
    paths:
      - packages/gateway/**
      - packages/skill/package.json
      - package.json
      - package-lock.json
      - .github/workflows/gateway-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/guy16510/alexa-plex-proxy:latest
            ghcr.io/guy16510/alexa-plex-proxy:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/guy16510/alexa-plex-proxy
            org.opencontainers.image.revision=${{ github.sha }}
