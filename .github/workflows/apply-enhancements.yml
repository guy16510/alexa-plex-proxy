name: Apply enhanced player changes

on:
  push:
    branches:
      - feature/richer-player-and-personality

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/richer-player-and-personality
          fetch-depth: 0
      - name: Apply reviewed payload
        shell: bash
        run: |
          if [[ ! -f .enhancement-payload.part-05 ]]; then
            echo "Payload is not complete yet."
            exit 0
          fi
          cat .enhancement-payload.part-* > /tmp/enhancements.b64
          base64 --decode /tmp/enhancements.b64 > /tmp/enhancements.tar.gz
          echo "10cca3edd410e0b10b7b3d78b562bc3f689ec7f59e0c1a30d15826588eaac4da  /tmp/enhancements.tar.gz" | sha256sum --check
          tar -xzf /tmp/enhancements.tar.gz
          rm .enhancement-payload.part-*
          rm .github/workflows/apply-enhancements.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Enhance Alexa player, lyrics, controls, and personality"
          git push origin HEAD:feature/richer-player-and-personality
