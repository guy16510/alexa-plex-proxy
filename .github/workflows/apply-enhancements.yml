name: Assemble reviewed Plex client

on:
  push:
    branches:
      - feature/richer-player-and-personality

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/richer-player-and-personality
          fetch-depth: 0
      - name: Assemble and verify reviewed source
        shell: bash
        run: |
          test -f .plex-client.part-03 || exit 0
          cat .plex-client.part-01 .plex-client.part-02 .plex-client.part-03 > src/plex-client.js
          echo "7cbdbfc5ddeef67beaf0ad923a9ddfaaedcf8acfa814f425318e909af73bd503  src/plex-client.js" | sha256sum --check
          rm -f .enhancement-payload.part-* .plex-client.part-*
          rm .github/workflows/apply-enhancements.yml
          npm ci
          npm test
          npm run check
          npm run validate:model
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish enhanced Plex player implementation"
          git push origin HEAD:feature/richer-player-and-personality
